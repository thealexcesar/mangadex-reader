name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          curl -sf --max-time 30 https://manga.facil.cc/ \
            && echo "OK: app respondeu" \
            || echo "FALHOU: app não respondeu (pode estar em cold start)"
